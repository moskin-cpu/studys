<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Study Hub</title>
  <style>
    :root{--bg:#0b1020;--panel:#121a31;--panel-2:#182344;--text:#eef2ff;--muted:#b6c2e3;--accent:#7aa2ff;--good:#2ecc71;--bad:#ff6b6b;--border:#2c3963;--warn:#f0a500;--purple:#a78bfa;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#08101e 0%,#0b1020 100%);color:var(--text);min-height:100vh;}
    .wrap{max-width:980px;margin:0 auto;padding:28px 18px 40px;}
    .hero{text-align:center;margin-bottom:30px;}
    h1{margin:0 0 10px;font-size:clamp(2rem,4vw,3rem);line-height:1.1;background:linear-gradient(135deg,#7aa2ff,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .sub{color:var(--muted);font-size:1.1rem;max-width:600px;margin:0 auto;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:30px;}
    .card{background:rgba(18,26,49,.95);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.28);backdrop-filter:blur(10px);transition:transform .2s,border-color .2s;cursor:pointer;display:flex;flex-direction:column;gap:12px;}
    .card:hover{transform:translateY(-4px);border-color:var(--accent);}
    .card-header{display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .card-title{font-size:1.15rem;font-weight:700;color:var(--text);margin:0;}
    .tag{font-size:.72rem;padding:4px 10px;border-radius:999px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
    .tag-stats{background:rgba(122,162,255,.15);color:#9ab8ff;border:1px solid rgba(122,162,255,.3);}
    .tag-bio{background:rgba(46,204,113,.15);color:#7ee8a6;border:1px solid rgba(46,204,113,.3);}
    .tag-chem{background:rgba(240,165,0,.15);color:#f0c060;border:1px solid rgba(240,165,0,.3);}
    .tag-physics{background:rgba(167,139,250,.15);color:#c4b5fd;border:1px solid rgba(167,139,250,.3);}
    .card-desc{color:var(--muted);font-size:.9rem;line-height:1.5;flex:1;}
    .card-meta{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border);margin-top:auto;}
    .count{font-size:.85rem;color:var(--muted);}
    .count strong{color:var(--accent);font-weight:700;}
    .arrow{font-size:1.2rem;color:var(--accent);opacity:0;transform:translateX(-8px);transition:all .2s;}
    .card:hover .arrow{opacity:1;transform:translateX(0);}
    .footer{margin-top:40px;text-align:center;color:var(--muted);font-size:.9rem;}
    .footer a{color:var(--accent);text-decoration:none;}
    .footer a:hover{text-decoration:underline;}
    @media(max-width:600px){.grid{grid-template-columns:1fr;}.wrap{padding:18px 14px 30px;}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>📚 Quiz Study Hub</h1>
    <p class="sub">Select a question set to start studying. Master all cards to complete each set!</p>
  </div>
  
  <div class="grid" id="cardGrid"></div>
  
  <div class="footer">
    <p>Built with adaptive learning — cards get harder as you improve.</p>
  </div>
</div>

<script>
// Question Set Manifest
const SETS = [
  { id: "ap-stats-u6", title: "AP Stats — Unit 6", count: 38, tag: "Stats", desc: "Inference for Proportions — CIs, hypothesis tests, margin of error, and sampling distributions." },
  { id: "ap-stats-u7", title: "AP Stats — Unit 7", count: 10, tag: "Stats", desc: "Inference for Quantitative Data — Means, t-tests, matched pairs, and confidence intervals." },
];

const TAG_CLASSES = {
  "Stats": "tag-stats",
  "Bio": "tag-bio",
  "Chem": "tag-chem",
  "Physics": "tag-physics"
};

function renderCards() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  
  SETS.forEach(set => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => {
      window.location.href = `engine.html?set=${set.id}`;
    };
    
    const tagClass = TAG_CLASSES[set.tag] || 'tag-stats';
    
    card.innerHTML = `
      <div class="card-header">
        <h3 class="card-title">${set.title}</h3>
        <span class="tag ${tagClass}">${set.tag}</span>
      </div>
      <p class="card-desc">${set.desc}</p>
      <div class="card-meta">
        <span class="count"><strong>${set.count}</strong> questions</span>
        <span class="arrow">→</span>
      </div>
    `;
    
    grid.appendChild(card);
  });
}

renderCards();
</script>
</body>
</html>
