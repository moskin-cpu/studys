<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Engine - StudyS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .quiz-info {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .quiz-info h2 {
            margin-bottom: 10px;
            color: #4ecca3;
        }

        .quiz-info p {
            color: #aaa;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #4ecca3, #45b393);
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px 20px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option-btn:hover {
            background: rgba(78, 204, 163, 0.3);
            border-color: #4ecca3;
        }

        .option-btn.selected {
            background: #4ecca3;
            border-color: #4ecca3;
            color: #1a1a2e;
        }

        .option-btn.correct {
            background: #2ecc71;
            border-color: #2ecc71;
        }

        .option-btn.incorrect {
            background: #e74c3c;
            border-color: #e74c3c;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4ecca3, #45b393);
            color: #1a1a2e;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(78, 204, 163, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .score-display {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .score-display h2 {
            font-size: 3rem;
            color: #4ecca3;
            margin-bottom: 20px;
        }

        .score-display p {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }

        .hidden {
            display: none;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }

        .feedback.correct {
            background: rgba(46, 204, 113, 0.3);
            color: #2ecc71;
        }

        .feedback.incorrect {
            background: rgba(231, 76, 60, 0.3);
            color: #e74c3c;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4ecca3;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #45b393;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Quiz Engine</h1>
            <a href="index.html" class="back-link">← Back to Menu</a>
        </header>

        <div id="loading">
            <p style="text-align: center; padding: 50px;">Loading quiz set...</p>
        </div>

        <div id="quiz-container" class="hidden">
            <div class="quiz-info">
                <h2 id="quiz-title">Quiz Title</h2>
                <p id="quiz-description">Quiz description</p>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
                <p>Question <span id="current-q">1</span> of <span id="total-q">10</span></p>
            </div>

            <div class="question-card">
                <p class="question-text" id="question-text">Question goes here?</p>
                <div class="options" id="options-container"></div>
                <div class="feedback hidden" id="feedback"></div>
            </div>

            <div class="controls">
                <button class="btn btn-secondary" id="skip-btn">Skip</button>
                <button class="btn btn-primary" id="next-btn" disabled>Next</button>
            </div>
        </div>

        <div id="score-container" class="hidden">
            <div class="score-display">
                <h2 id="final-score">8/10</h2>
                <p id="score-message">Great job!</p>
                <button class="btn btn-primary" onclick="restartQuiz()">Try Again</button>
                <br><br>
                <a href="index.html" class="btn btn-secondary">Back to Menu</a>
            </div>
        </div>
    </div>

    <script>
        // Game state
        let currentQuestion = 0;
        let score = 0;
        let questions = [];
        let selectedOption = null;
        let answered = false;

        // Load the quiz set based on URL parameter
        const params = new URLSearchParams(window.location.search);
        const setId = params.get('set');

        if (!setId) {
            document.getElementById('loading').innerHTML = '<p style="text-align: center; padding: 50px; color: #e74c3c;">No quiz set specified. <a href="index.html" style="color: #4ecca3;">Go back to menu</a></p>';
        } else {
            // Dynamically load the quiz set file
            const script = document.createElement('script');
            script.src = `sets/${setId}.js`;
            script.onerror = () => {
                document.getElementById('loading').innerHTML = `<p style="text-align: center; padding: 50px; color: #e74c3c;">Quiz set "${setId}" not found. <a href="index.html" style="color: #4ecca3;">Go back to menu</a></p>`;
            };
            script.onload = () => {
                if (window.QUIZ_SET) {
                    initializeQuiz(window.QUIZ_SET);
                } else {
                    document.getElementById('loading').innerHTML = `<p style="text-align: center; padding: 50px; color: #e74c3c;">Invalid quiz set format. <a href="index.html" style="color: #4ecca3;">Go back to menu</a></p>`;
                }
            };
            document.head.appendChild(script);
        }

        function initializeQuiz(quizSet) {
            questions = quizSet.questions;
            document.getElementById('quiz-title').textContent = quizSet.title;
            document.getElementById('quiz-description').textContent = quizSet.description || `${questions.length} questions`;
            document.getElementById('total-q').textContent = questions.length;
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            selectedOption = null;
            const q = questions[currentQuestion];
            
            document.getElementById('current-q').textContent = currentQuestion + 1;
            document.getElementById('question-text').textContent = q.question;
            document.getElementById('progress-fill').style.width = `${((currentQuestion) / questions.length) * 100}%`;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const allOptions = [...q.options];
            // Shuffle options if not already shuffled
            allOptions.sort(() => Math.random() - 0.5);
            
            allOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectOption(index, option, btn);
                optionsContainer.appendChild(btn);
            });
            
            document.getElementById('next-btn').disabled = true;
            document.getElementById('feedback').classList.add('hidden');
        }

        function selectOption(index, option, btn) {
            if (answered) return;
            
            selectedOption = index;
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('next-btn').disabled = false;
        }

        function checkAnswer() {
            if (answered || selectedOption === null) return;
            
            answered = true;
            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option-btn');
            const feedback = document.getElementById('feedback');
            
            // Find the correct option
            const correctIndex = q.options.indexOf(q.correctAnswer);
            
            options.forEach((btn, index) => {
                const optionText = btn.textContent;
                if (optionText === q.correctAnswer) {
                    btn.classList.add('correct');
                } else if (index === selectedOption && optionText !== q.correctAnswer) {
                    btn.classList.add('incorrect');
                }
            });
            
            if (questions[selectedOption]?.textContent === q.correctAnswer || 
                options[selectedOption]?.textContent === q.correctAnswer) {
                score++;
                feedback.textContent = '✓ Correct!';
                feedback.className = 'feedback correct';
            } else {
                feedback.textContent = `✗ Incorrect. The answer was: ${q.correctAnswer}`;
                feedback.className = 'feedback incorrect';
            }
            
            feedback.classList.remove('hidden');
        }

        function nextQuestion() {
            if (!answered && selectedOption !== null) {
                checkAnswer();
                return;
            }
            
            if (answered) {
                currentQuestion++;
                if (currentQuestion >= questions.length) {
                    showScore();
                } else {
                    loadQuestion();
                }
            }
        }

        function skipQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showScore();
            } else {
                loadQuestion();
            }
        }

        function showScore() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('score-container').classList.remove('hidden');
            document.getElementById('final-score').textContent = `${score}/${questions.length}`;
            
            const percentage = (score / questions.length) * 100;
            let message = '';
            if (percentage >= 90) message = '🏆 Excellent!';
            else if (percentage >= 70) message = '👍 Good job!';
            else if (percentage >= 50) message = '📚 Keep practicing!';
            else message = '💪 Don\'t give up!';
            
            document.getElementById('score-message').textContent = message;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('score-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            loadQuestion();
        }

        // Event listeners
        document.getElementById('next-btn').onclick = nextQuestion;
        document.getElementById('skip-btn').onclick = skipQuestion;

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !document.getElementById('next-btn').disabled) {
                nextQuestion();
            }
        });
    </script>
</body>
</html>
