<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Engine</title>
</head>
<body>
    <h1>Quiz Engine</h1>
    <h2 id="quiz-title"></h2>
    <div id="quiz-questions"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const setId = params.get("set"); // "sample-quiz"

        if (setId) {
            const script = document.createElement("script");
            script.src = `sets/${setId}.js`;
            script.onload = () => {
                const { title, questions } = window.QUIZ_SET;
                document.getElementById("quiz-title").innerText = title;
                startGame(questions); // Placeholder for your existing engine
            };
            document.head.appendChild(script);
        } else {
            document.getElementById("quiz-title").innerText = "No quiz set selected.";
        }

        // Placeholder for your existing game engine function
        function startGame(questions) {
            const quizQuestionsDiv = document.getElementById("quiz-questions");
            quizQuestionsDiv.innerHTML = '<h3>Questions will appear here!</h3>';
            questions.forEach((q, index) => {
                const p = document.createElement("p");
                p.innerText = `${index + 1}. ${q.question}`;
                quizQuestionsDiv.appendChild(p);
            });
            console.log("Starting game with questions:", questions);
            // This is where your actual quiz logic would go
        }
    </script>
</body>
</html>
